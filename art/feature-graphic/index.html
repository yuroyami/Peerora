<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peerora feature graphic</title>
<!--
  The Peerora feature graphic, as a fixed 1920 x 1080 page.
  Open this file in a browser, or run render.sh to get a PNG at 3840 x 2160.
  Add ?theme=light to the URL for the light variant. The default is the dark variant.
  The logo comes from the lockup SVGs, so the mark and the lettering are always the real ones.
  The mark gets no ring, glow or particle, as art/README.md says.
-->
<style>
  @font-face {
    font-family: "Manrope";
    src: url("fonts/manrope-latin.woff2") format("woff2");
    font-weight: 200 800;
    font-display: block;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("fonts/jetbrains-mono-latin.woff2") format("woff2");
    font-weight: 100 800;
    font-display: block;
  }

  :root {
    /* Dark variant. The colours come from the dark lockup and the app icon. */
    --bg: #03091B;
    --bg-lift: #0A142B;
    --ink: #F3F3F3;
    --ink-2: rgba(243, 243, 243, 0.74);
    --ink-3: rgba(243, 243, 243, 0.50);
    --rule: rgba(243, 243, 243, 0.16);
    --grad: linear-gradient(90deg, #64DDD8 0%, #77AEE4 55%, #8C66F7 100%);
    --grad-v: linear-gradient(180deg, #64DDD8 0%, #77AEE4 55%, #8C66F7 100%);
  }
  :root[data-theme="light"] {
    --bg: #F2F2F2;
    --bg-lift: #E4EAF2;
    --ink: #0A132A;
    --ink-2: rgba(10, 19, 42, 0.80);
    --ink-3: rgba(10, 19, 42, 0.58);
    --rule: rgba(10, 19, 42, 0.20);
    --grad: linear-gradient(90deg, #0A807A 0%, #277BB7 55%, #6546CE 100%);
    --grad-v: linear-gradient(180deg, #0A807A 0%, #277BB7 55%, #6546CE 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Manrope", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .canvas {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    padding: 96px 96px 64px;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto 1fr auto;
    background:
      radial-gradient(1400px 900px at 14% -10%, var(--bg-lift) 0%, transparent 62%),
      var(--bg);
  }

  /* The lockup is the hero. Negative margins cancel its clear space, so it lines up with the text. */
  .logo { display: none; width: 1890px; height: auto; max-width: none; margin: -81px 0 -81px -81px; }
  :root:not([data-theme="light"]) .logo.dark { display: block; }
  :root[data-theme="light"] .logo.light { display: block; }

  .tagline {
    margin: 104px 0 0;
    font-size: 72px;
    line-height: 1.12;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .tagline strong { font-weight: 700; }

  /* The targets, one line. */
  .targets {
    display: flex;
    align-items: center;
    gap: 30px;
    margin-top: 84px;
    font-size: 52px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.015em;
    white-space: nowrap;
  }
  .targets .sep {
    flex: none;
    width: 5px;
    height: 44px;
    border-radius: 3px;
    background: var(--grad-v);
    transform: skewX(-20deg);
  }
  .targets .hero {
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* One line of how the link works. */
  .features {
    margin: 44px 0 0;
    font-size: 40px;
    line-height: 1.3;
    font-weight: 500;
    color: var(--ink-2);
  }
  .features .dot { color: var(--ink-3); padding: 0 10px; }

  .footer {
    grid-row: 6;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 28px;
    line-height: 1;
    font-weight: 500;
    color: var(--ink-2);
  }
  .footer .repo { display: flex; align-items: center; gap: 18px; }
  .footer .repo svg { width: 36px; height: 36px; fill: var(--ink); }
  .footer .license { color: var(--ink-3); }
</style>
</head>
<body>
<main class="canvas">
  <div>
    <img class="logo dark" src="../peerora-lockup-dark.svg" alt="Peerora">
    <img class="logo light" src="../peerora-lockup-light.svg" alt="Peerora">
  </div>

  <p class="tagline"><strong>Direct links</strong> between nearby devices<br>for Kotlin Multiplatform</p>

  <div class="targets" aria-label="Supported platforms">
    <span class="hero">Android</span><span class="sep"></span>
    <span>iOS</span><span class="sep"></span>
    <span>macOS</span><span class="sep"></span>
    <span>JVM</span>
  </div>

  <p class="features">Bluetooth LE<span class="dot">·</span>Local network<span class="dot">·</span>Wi-Fi<span class="dot">·</span>Encrypted links<span class="dot">·</span>Automatic reconnect</p>

  <footer class="footer">
    <span class="repo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      github.com/yuroyami/Peerora
    </span>
    <span class="license">Apache-2.0</span>
  </footer>
</main>

<script>
  // ?theme=light switches to the light variant. Anything else keeps the dark one.
  var theme = new URLSearchParams(location.search).get("theme");
  if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
</script>
</body>
</html>
